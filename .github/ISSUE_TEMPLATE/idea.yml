name: Idea
description: Suggest a new feature or a change.
labels: ["idea"]
body:
  - type: markdown
    attributes:
      value: Ideas that need generative AI can't be accepted. Everything else is welcome.
  - type: textarea
    id: task
    attributes:
      label: What are you trying to do?
      description: Describe the task in your own words, for example "I lose track of which references I used for each commission."
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How do you do it today?
      description: Which apps, folders or workarounds you use now.
  - type: textarea
    id: help
    attributes:
      label: What would help?
